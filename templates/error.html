{% extends "base.html" %}
{% block content %}
<div style="max-width: 520px; margin: 4rem auto; text-align: center; animation: fadeInUp 0.4s ease both;">
    <div class="card" style="padding: 3rem 2rem;">
        <div style="font-size: 3rem; font-weight: 800; line-height: 1; margin-bottom: 1rem;
                    background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
                    -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
            {{ code }}
        </div>
        <h2 style="margin-bottom: 0.75rem;">{{ title }}</h2>
        <p class="text-muted" style="line-height: 1.6; margin-bottom: 2rem;">{{ message }}</p>
        <a href="{{ url_for('dashboard') if session.get('user_id') else url_for('home') }}" class="btn">
            <i data-lucide="arrow-left" width="16" height="16"></i>
            {{ 'Back to dashboard' if session.get('user_id') else 'Back to home' }}
        </a>
    </div>
</div>
{% endblock %}
