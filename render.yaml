services:
  - type: web
    name: vaulty
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    # Free instances get 0.1 CPU / 512 MB, so run a single worker with threads.
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 120 --preload
    healthCheckPath: /health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: FIREBASE_API_KEY
        sync: false
      # Optional: enables Reddit's authenticated API for Explore.
      # Without these, Explore falls back to Hacker News.
      - key: REDDIT_CLIENT_ID
        sync: false
      - key: REDDIT_CLIENT_SECRET
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.6
      # External Postgres (Neon free tier). Render's own free Postgres expires
      # after 30 days, so the database is provisioned elsewhere.
      - key: DATABASE_URL
        sync: false
